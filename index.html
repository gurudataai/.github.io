<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            gap: 10px;
        }

        input[type="text"], input[type="number"], select {
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 5px;
            font-size: 1em;
            flex: 1;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #764ba2;
        }

        button.secondary {
            background: #28a745;
        }

        button.secondary:hover {
            background: #218838;
        }

        button.danger {
            background: #dc3545;
        }

        button.danger:hover {
            background: #c82333;
        }

        button.export {
            background: #fd7e14;
        }

        button.export:hover {
            background: #e86c00;
        }

        .content {
            padding: 20px;
        }

        .goal-item {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            transition: box-shadow 0.3s ease;
        }

        .goal-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .goal-title {
            font-size: 1.5em;
            font-weight: 700;
            color: #333;
        }

        .goal-progress {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar {
            width: 150px;
            height: 8px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .progress-text {
            font-weight: 600;
            color: #667eea;
            min-width: 50px;
            text-align: right;
        }

        .goal-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .action-item {
            background: white;
            border-left: 3px solid #28a745;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 3px;
            margin-left: 20px;
        }

        .action-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .action-title {
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .action-progress {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-progress input[type="number"] {
            width: 60px;
            padding: 5px;
        }

        .action-progress-bar {
            width: 100px;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin: 0 10px;
        }

        .action-progress-fill {
            height: 100%;
            background: #28a745;
            transition: width 0.3s ease;
        }

        .sub-action {
            background: #f8f9fa;
            border-left: 2px solid #ffc107;
            padding: 10px 15px;
            margin-top: 8px;
            border-radius: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-left: 20px;
        }

        .sub-action input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .sub-action.completed {
            background: #d4edda;
            opacity: 0.7;
        }

        .sub-action.completed .sub-action-text {
            text-decoration: line-through;
            color: #666;
        }

        .sub-action-text {
            flex: 1;
            margin-left: 10px;
        }

        .sub-action-actions {
            display: flex;
            gap: 5px;
        }

        .sub-action-actions button {
            padding: 5px 10px;
            font-size: 0.85em;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state p {
            font-size: 1.2em;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-body input, .modal-body textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #e9ecef;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }

        .modal-body textarea {
            resize: vertical;
            min-height: 100px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group input, .input-group button {
                width: 100%;
            }

            .goal-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .goal-progress {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Goal Tracker</h1>
            <p>Manage your goals, actions, and track progress</p>
        </div>

        <div class="controls">
            <div class="input-group">
                <input type="text" id="goalInput" placeholder="Enter your goal...">
                <button onclick="addGoal()">Add Goal</button>
            </div>
            <div class="button-group">
                <button class="export" onclick="exportData()">📥 Export Data</button>
                <button class="export" onclick="importData()">📤 Import Data</button>
                <button class="danger" onclick="clearAllData()">🗑️ Clear All</button>
            </div>
        </div>

        <div class="content" id="goalsContainer">
            <div class="empty-state">
                <p>📝 No goals yet. Add your first goal to get started!</p>
            </div>
        </div>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="fileInput" style="display: none;" accept=".json">

    <!-- Modal for adding action items -->
    <div class="modal" id="actionModal">
        <div class="modal-content">
            <div class="modal-header">Add Action Item</div>
            <div class="modal-body">
                <input type="text" id="actionInput" placeholder="Enter action item...">
            </div>
            <div class="modal-footer">
                <button onclick="closeActionModal()">Cancel</button>
                <button class="secondary" onclick="confirmAddAction()">Add Action</button>
            </div>
        </div>
    </div>

    <!-- Modal for adding sub-actions -->
    <div class="modal" id="subActionModal">
        <div class="modal-content">
            <div class="modal-header">Add Sub-Action</div>
            <div class="modal-body">
                <input type="text" id="subActionInput" placeholder="Enter sub-action...">
            </div>
            <div class="modal-footer">
                <button onclick="closeSubActionModal()">Cancel</button>
                <button class="secondary" onclick="confirmAddSubAction()">Add Sub-Action</button>
            </div>
        </div>
    </div>

    <script>
        // Data structure
        let goalsData = [];
        let currentGoalId = null;
        let currentActionId = null;

        // Load data from localStorage on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderGoals();
        });

        // Add a new goal
        function addGoal() {
            const input = document.getElementById('goalInput');
            const goalText = input.value.trim();

            if (!goalText) {
                alert('Please enter a goal');
                return;
            }

            const goal = {
                id: Date.now(),
                title: goalText,
                actions: [],
                createdAt: new Date().toISOString()
            };

            goalsData.push(goal);
            saveData();
            renderGoals();
            input.value = '';
        }

        // Add action item to a goal
        function openActionModal(goalId) {
            currentGoalId = goalId;
            document.getElementById('actionModal').classList.add('active');
            document.getElementById('actionInput').focus();
        }

        function closeActionModal() {
            document.getElementById('actionModal').classList.remove('active');
            document.getElementById('actionInput').value = '';
            currentGoalId = null;
        }

        function confirmAddAction() {
            const input = document.getElementById('actionInput');
            const actionText = input.value.trim();

            if (!actionText) {
                alert('Please enter an action item');
                return;
            }

            const goal = goalsData.find(g => g.id === currentGoalId);
            if (goal) {
                const action = {
                    id: Date.now(),
                    title: actionText,
                    progress: 0,
                    subActions: []
                };
                goal.actions.push(action);
                saveData();
                renderGoals();
                closeActionModal();
            }
        }

        // Add sub-action
        function openSubActionModal(goalId, actionId) {
            currentGoalId = goalId;
            currentActionId = actionId;
            document.getElementById('subActionModal').classList.add('active');
            document.getElementById('subActionInput').focus();
        }

        function closeSubActionModal() {
            document.getElementById('subActionModal').classList.remove('active');
            document.getElementById('subActionInput').value = '';
            currentGoalId = null;
            currentActionId = null;
        }

        function confirmAddSubAction() {
            const input = document.getElementById('subActionInput');
            const subActionText = input.value.trim();

            if (!subActionText) {
                alert('Please enter a sub-action');
                return;
            }

            const goal = goalsData.find(g => g.id === currentGoalId);
            if (goal) {
                const action = goal.actions.find(a => a.id === currentActionId);
                if (action) {
                    const subAction = {
                        id: Date.now(),
                        title: subActionText,
                        completed: false
                    };
                    action.subActions.push(subAction);
                    saveData();
                    renderGoals();
                    closeSubActionModal();
                }
            }
        }

        // Update action progress
        function updateActionProgress(goalId, actionId, value) {
            const goal = goalsData.find(g => g.id === goalId);
            if (goal) {
                const action = goal.actions.find(a => a.id === actionId);
                if (action) {
                    action.progress = Math.max(0, Math.min(100, parseInt(value) || 0));
                    saveData();
                    renderGoals();
                }
            }
        }

        // Toggle sub-action completion
        function toggleSubAction(goalId, actionId, subActionId) {
            const goal = goalsData.find(g => g.id === goalId);
            if (goal) {
                const action = goal.actions.find(a => a.id === actionId);
                if (action) {
                    const subAction = action.subActions.find(sa => sa.id === subActionId);
                    if (subAction) {
                        subAction.completed = !subAction.completed;
                        saveData();
                        renderGoals();
                    }
                }
            }
        }

        // Delete sub-action
        function deleteSubAction(goalId, actionId, subActionId) {
            const goal = goalsData.find(g => g.id === goalId);
            if (goal) {
                const action = goal.actions.find(a => a.id === actionId);
                if (action) {
                    action.subActions = action.subActions.filter(sa => sa.id !== subActionId);
                    saveData();
                    renderGoals();
                }
            }
        }

        // Delete action
        function deleteAction(goalId, actionId) {
            const goal = goalsData.find(g => g.id === goalId);
            if (goal) {
                goal.actions = goal.actions.filter(a => a.id !== actionId);
                saveData();
                renderGoals();
            }
        }

        // Delete goal
        function deleteGoal(goalId) {
            if (confirm('Are you sure you want to delete this goal?')) {
                goalsData = goalsData.filter(g => g.id !== goalId);
                saveData();
                renderGoals();
            }
        }

        // Calculate goal progress
        function calculateGoalProgress(goal) {
            if (goal.actions.length === 0) return 0;
            const totalProgress = goal.actions.reduce((sum, action) => sum + action.progress, 0);
            return Math.round(totalProgress / goal.actions.length);
        }

        // Render all goals
        function renderGoals() {
            const container = document.getElementById('goalsContainer');

            if (goalsData.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>📝 No goals yet. Add your first goal to get started!</p></div>';
                return;
            }

            container.innerHTML = goalsData.map(goal => {
                const goalProgress = calculateGoalProgress(goal);
                return `
                    <div class="goal-item">
                        <div class="goal-header">
                            <div class="goal-title">${escapeHtml(goal.title)}</div>
                            <div class="goal-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${goalProgress}%"></div>
                                </div>
                                <div class="progress-text">${goalProgress}%</div>
                                <button class="danger" style="padding: 5px 10px; font-size: 0.9em;" onclick="deleteGoal(${goal.id})">Delete</button>
                            </div>
                        </div>
                        <div class="goal-actions">
                            <button class="secondary" onclick="openActionModal(${goal.id})">➕ Add Action</button>
                        </div>
                        ${goal.actions.map(action => `
                            <div class="action-item">
                                <div class="action-header">
                                    <div class="action-title">${escapeHtml(action.title)}</div>
                                    <div class="action-progress">
                                        <input type="number" min="0" max="100" value="${action.progress}" 
                                            onchange="updateActionProgress(${goal.id}, ${action.id}, this.value)">
                                        <span>%</span>
                                        <div class="action-progress-bar">
                                            <div class="action-progress-fill" style="width: ${action.progress}%"></div>
                                        </div>
                                        <button class="secondary" style="padding: 5px 10px; font-size: 0.9em;" onclick="openSubActionModal(${goal.id}, ${action.id})">➕ Add Sub</button>
                                        <button class="danger" style="padding: 5px 10px; font-size: 0.9em;" onclick="deleteAction(${goal.id}, ${action.id})">Delete</button>
                                    </div>
                                </div>
                                ${action.subActions.length > 0 ? `
                                    <div style="margin-top: 10px;">
                                        ${action.subActions.map(subAction => `
                                            <div class="sub-action ${subAction.completed ? 'completed' : ''}">
                                                <input type="checkbox" ${subAction.completed ? 'checked' : ''} 
                                                    onchange="toggleSubAction(${goal.id}, ${action.id}, ${subAction.id})">
                                                <span class="sub-action-text">${escapeHtml(subAction.title)}</span>
                                                <div class="sub-action-actions">
                                                    <button class="danger" onclick="deleteSubAction(${goal.id}, ${action.id}, ${subAction.id})">Delete</button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            }).join('');
        }

        // Save data to localStorage
        function saveData() {
            localStorage.setItem('goalsData', JSON.stringify(goalsData));
        }

        // Load data from localStorage
        function loadData() {
            const saved = localStorage.getItem('goalsData');
            if (saved) {
                try {
                    goalsData = JSON.parse(saved);
                } catch (e) {
                    console.error('Error loading data:', e);
                    goalsData = [];
                }
            }
        }

        // Export data as JSON
        function exportData() {
            const dataStr = JSON.stringify(goalsData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `goals-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Import data from JSON file
        function importData() {
            document.getElementById('fileInput').click();
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm('Replace existing data with imported data?')) {
                            goalsData = imported;
                            saveData();
                            renderGoals();
                            alert('Data imported successfully!');
                        }
                    } else {
                        alert('Invalid file format. Expected JSON array.');
                    }
                } catch (error) {
                    alert('Error reading file: ' + error.message);
                }
            };
            reader.readAsText(file);
        });

        // Clear all data
        function clearAllData() {
            if (confirm('Are you sure? This will delete all goals and cannot be undone.')) {
                goalsData = [];
                saveData();
                renderGoals();
            }
        }

        // Utility function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to add goals
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('goalInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addGoal();
            });
            document.getElementById('actionInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') confirmAddAction();
            });
            document.getElementById('subActionInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') confirmAddSubAction();
            });
        });
    </script>
</body>
</html>
